name: Census-state geographic figures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/grid_resilience/plot_census_geography.py'
      - '.github/workflows/census-geography.yml'
jobs:
  maps:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'geopandas>=1.0' matplotlib pandas pyogrio
      - run: python -m grid_resilience.plot_census_geography --output figures
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        with:
          name: census-geography-figures
          path: figures/*census*.svg
      - name: Commit verified state-basemap SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/*census*.svg figures/*census*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Census 2024 state-basemap geographic figures'
            git push
          fi
