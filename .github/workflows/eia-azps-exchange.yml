name: EIA observed AZPS pairwise interchange audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eia-azps-exchange.yml'
      - 'src/grid_resilience/eia_exchange_api.py'
      - 'tests/test_eia_exchange_api.py'
      - 'src/grid_resilience/azps_observed_balance.py'
      - 'tests/test_azps_observed_balance.py'
jobs:
  exchange-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,model]'
      - run: python -m pytest -q tests/test_eia_exchange_api.py
      - name: Fetch observed AZPS EIA-930 bilateral exchange
        run: python -m grid_resilience.eia_exchange_api --start 2024-07-01 --end 2024-07-08 --output data/processed/azps_exchange.csv
      - name: Download matching observed BA demand
        run: python -m grid_resilience.eia_api --start 2024-07-01 --end 2024-07-08 --output data/processed/eia930_api_demand.csv
      - name: Audit AZPS observed demand and cross-BA balance
        run: |
          python -m grid_resilience.azps_observed_balance \
            --exchange-csv data/processed/azps_exchange.csv \
            --demand-csv data/processed/eia930_api_demand.csv \
            --output outputs/azps_observed_balance
      - name: Upload observed exchanges and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azps-observed-eia930-bilateral-exchanges
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/processed/azps_exchange.csv
            data/processed/azps_observed_pairwise_exchange_summary.csv
            data/processed/azps_exchange_provenance.json
            data/processed/eia930_api_demand_provenance.json
            outputs/azps_observed_balance/
