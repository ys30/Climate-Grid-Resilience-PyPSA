name: EIA observed AZPS pairwise interchange audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eia-azps-exchange.yml'
      - 'src/grid_resilience/eia_exchange_api.py'
      - 'tests/test_eia_exchange_api.py'
      - 'src/grid_resilience/azps_observed_balance.py'
      - 'tests/test_azps_observed_balance.py'
      - 'src/grid_resilience/srp_azps_audit.py'
      - 'tests/test_srp_azps_audit.py'
      - 'src/grid_resilience/eia_api.py'
      - 'src/grid_resilience/eia_net_generation.py'
      - 'src/grid_resilience/azps_generation_reconciliation.py'
      - 'tests/test_generation_reconciliation.py'
      - 'src/grid_resilience/azps_boundary_coverage.py'
      - 'tests/test_azps_boundary_coverage.py'
      - 'src/grid_resilience/azps_boundary_hourly_diagnostic.py'
      - 'tests/test_azps_boundary_hourly_diagnostic.py'
jobs:
  exchange-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,model]'
      - run: python -m pytest -q tests/test_eia_exchange_api.py
      - name: Fetch observed AZPS EIA-930 bilateral exchange
        run: python -m grid_resilience.eia_exchange_api --start 2024-07-01 --end 2024-07-08 --output data/processed/azps_exchange.csv
      - name: Audit unmodeled AZPS exchange partners
        run: python -m grid_resilience.azps_boundary_coverage --exchange-csv data/processed/azps_exchange.csv --output outputs/azps_boundary_coverage
      - name: Download matching observed BA demand
        run: python -m grid_resilience.eia_api --start 2024-07-01 --end 2024-07-08 --output data/processed/eia930_api_demand.csv
      - name: Audit AZPS observed demand and cross-BA balance
        run: |
          python -m grid_resilience.azps_observed_balance \
            --exchange-csv data/processed/azps_exchange.csv \
            --demand-csv data/processed/eia930_api_demand.csv \
            --output outputs/azps_observed_balance
      - name: Quantify hourly outside-boundary AZPS imports and exports
        run: |
          python -m grid_resilience.azps_boundary_hourly_diagnostic \
            --boundary-csv outputs/azps_boundary_coverage/azps_boundary_hourly.csv \
            --balance-csv outputs/azps_observed_balance/azps_hourly_demand_import_balance.csv \
            --output outputs/azps_outside_boundary
      - name: Download SRP and AZPS demand for observed-neighbor validation
        run: |
          python -m grid_resilience.eia_api --start 2024-07-01 --end 2024-07-08 --bas AZPS SRP --output data/processed/srp_azps_demand.csv
      - name: Validate SRP demand and AZPS bilateral exchange alignment
        run: |
          python -m grid_resilience.srp_azps_audit --demand-csv data/processed/srp_azps_demand.csv --exchange-csv data/processed/azps_exchange.csv --output outputs/srp_azps
      - name: Download independently reported AZPS and SRP net generation
        run: |
          python -m grid_resilience.eia_net_generation --start 2024-07-01 --end 2024-07-08 --bas AZPS SRP --output data/processed/azps_srp_reported_ng.csv
      - name: Reconcile AZPS demand and reported net generation
        run: |
          python -m grid_resilience.azps_generation_reconciliation \
            --balance-csv outputs/azps_observed_balance/azps_hourly_demand_import_balance.csv \
            --generation-csv data/processed/azps_srp_reported_ng.csv \
            --output outputs/azps_generation_reconciliation
      - name: Upload observed exchanges and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azps-observed-eia930-bilateral-exchanges
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/processed/azps_exchange.csv
            data/processed/azps_observed_pairwise_exchange_summary.csv
            data/processed/azps_exchange_provenance.json
            data/processed/eia930_api_demand_provenance.json
            outputs/azps_observed_balance/
            outputs/azps_boundary_coverage/
            outputs/azps_outside_boundary/
            data/processed/srp_azps_demand_provenance.json
            outputs/srp_azps/
            data/processed/azps_srp_reported_ng.csv
            data/processed/azps_srp_reported_ng.provenance.json
            outputs/azps_generation_reconciliation/
