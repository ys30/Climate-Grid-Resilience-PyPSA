name: EIA hourly data validation
on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC window start
        required: true
        default: '2024-07-01'
      end:
        description: Exclusive UTC window end
        required: true
        default: '2024-07-08'
jobs:
  validate-eia:
    runs-on: ubuntu-latest
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,model]'
      - name: Ensure EIA key is present
        shell: bash
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "EIA_API_KEY secret is missing or empty"
            exit 1
          fi
      - name: Fetch and validate EIA demand
        run: |
          python -m grid_resilience.eia_api --start "${{ inputs.start }}" --end "${{ inputs.end }}" --output data/processed/eia930_api_demand.csv
      - name: Upload demand and data provenance
        uses: actions/upload-artifact@v4
        with:
          name: eia-930-api-observed-hourly-demand
          path: |
            data/processed/eia930_api_demand.csv
            data/processed/eia930_api_demand_provenance.json
