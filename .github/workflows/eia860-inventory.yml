name: EIA-860 2024 official inventory validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/grid_resilience/eia860.py'
      - 'src/grid_resilience/download_eia860.py'
      - 'src/grid_resilience/run_eia860.py'
      - 'tests/test_eia860.py'
      - 'tests/test_download_eia860.py'
      - '.github/workflows/eia860-inventory.yml'
      - 'src/grid_resilience/nameplate_audit.py'
      - 'tests/test_nameplate_audit.py'
      - 'src/grid_resilience/capacity_adapter.py'
      - 'tests/test_capacity_adapter_guard.py'
      - 'src/grid_resilience/capacity_coverage.py'
      - 'tests/test_capacity_coverage.py'
jobs:
  validate-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline
        run: python -m pip install -e '.[dev,model]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Download and validate official EIA-860 2024
        run: python -m grid_resilience.run_eia860
      - name: Audit capacity coverage before optimization
        run: python -m grid_resilience.capacity_coverage --capacity-csv data/processed/eia860/eia860_ba_technology_capacity.csv --output outputs/capacity_coverage
      - name: Retrieve matching observed demand (if API key configured)
        if: env.EIA_API_KEY != ''
        run: |
          python -m grid_resilience.eia_api --start 2024-07-01 --end 2024-07-08 --output data/processed/eia930_api_demand.csv
      - name: Audit actual nameplate against EIA observed peak demand
        if: env.EIA_API_KEY != ''
        run: |
          python -m grid_resilience.nameplate_audit --capacity-csv data/processed/eia860/eia860_ba_technology_capacity.csv --demand-csv data/processed/eia930_api_demand.csv --start 2024-07-01 --end 2024-07-08 --output outputs/nameplate_audit
      - name: Upload inventory and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eia860-2024-capacity-audit
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/external/eia860_2024/download_manifest.json
            data/processed/eia860/
            outputs/nameplate_audit/
            outputs/capacity_coverage/
