name: Historical BA polygon repair comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-ba-repair-comparison.yml'
      - 'src/grid_resilience/compare_historical_polygon_repairs.py'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'geopandas>=1.0' 'pyogrio>=0.9'
      - run: PYTHONPATH=src python -m grid_resilience.compare_historical_polygon_repairs --output outputs/repair_comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hifld-ba-geometry-repair-comparison
          retention-days: 30
          path: outputs/repair_comparison/
