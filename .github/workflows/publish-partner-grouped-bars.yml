name: Publish audited partner grouped bars
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-partner-grouped-bars.yml'
      - 'src/grid_resilience/plot_partner_grouped_bars.py'
      - 'data/verified/seasonal_partner_exchange.csv'
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy matplotlib
      - run: PYTHONPATH=src python -m grid_resilience.plot_partner_grouped_bars
      - name: Commit and publish chart
        run: |
          test -s figures/azps_partner_exchange_grouped_bars.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/azps_partner_exchange_grouped_bars.svg figures/azps_partner_exchange_grouped_bars.png
          if ! git diff --cached --quiet; then
            git commit -m 'Publish audited grouped AZPS partner exchange bars'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
