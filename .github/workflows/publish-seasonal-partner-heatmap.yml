name: Publish verified seasonal partner heatmap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-seasonal-partner-heatmap.yml'
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previously validated EIA-930 result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41080237502 --repo "${{ github.repository }}" --name azps-2024-four-season-boundary --dir downloaded
          test -s downloaded/outputs/seasonal_partner_plots/azps_partner_exchange_heatmap.svg
          test -s downloaded/outputs/seasonal_partner_plots/seasonal_partner_exchange.csv
      - name: Commit verified heatmap and data
        run: |
          mkdir -p figures data/verified
          cp downloaded/outputs/seasonal_partner_plots/azps_partner_exchange_heatmap.svg figures/
          cp downloaded/outputs/seasonal_partner_plots/seasonal_partner_exchange.csv data/verified/
          python - <<'PY'
          from pathlib import Path
          import csv
          import xml.etree.ElementTree as ET
          p=Path("figures/azps_partner_exchange_heatmap.svg")
          assert ET.parse(p).getroot().tag.endswith("svg")
          with Path("data/verified/seasonal_partner_exchange.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert rows and set(r["season"] for r in rows)=={"winter","spring","summer","autumn"}
          assert {"partner","mean_net_import_mw","reported_hours","modeled"}.issubset(rows[0])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/azps_partner_exchange_heatmap.svg data/verified/seasonal_partner_exchange.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve verified four-season AZPS partner exchange directions'
            git push
          fi
