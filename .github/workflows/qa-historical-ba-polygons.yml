name: Validate historical HIFLD BA polygon geometry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-historical-ba-polygons.yml'
      - 'src/grid_resilience/qa_historical_ba_polygons.py'
      - 'src/grid_resilience/ba_polygon_source_audit.py'
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'geopandas>=1.0' 'pyogrio>=0.9'
      - run: PYTHONPATH=src python -m grid_resilience.qa_historical_ba_polygons --output outputs/ba_geometry_qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-hifld-ba-polygon-qa
          retention-days: 30
          path: outputs/ba_geometry_qa/
