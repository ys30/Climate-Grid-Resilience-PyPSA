name: SRP modeled versus observed interchange sensitivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srp-flow-validation.yml'
      - 'src/grid_resilience/srp_flow_validation.py'
      - 'tests/test_srp_flow_validation.py'
jobs:
  compare-flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,model]'
      - run: python -m pytest -q
      - name: Generate EIA-860 generator inventory for 4 BAs
        run: python -m grid_resilience.run_eia860 --bas CISO AZPS BPAT SRP --output data/processed/eia860_four_ba
      - name: Exclude unsupported storage/other capacity
        run: |
          python -m grid_resilience.capacity_projection --bas CISO AZPS BPAT SRP --source data/processed/eia860_four_ba/eia860_ba_technology_capacity.csv --output data/processed/four_ba_projection
      - name: Retrieve July 2024 EIA-930 observed demand
        run: |
          python -m grid_resilience.eia_api --bas CISO AZPS BPAT SRP --start 2024-07-01 --end 2024-07-08 --output data/processed/four_ba_demand.csv
      - name: Retrieve EIA-930 reported AZPS interchange
        run: |
          python -m grid_resilience.eia_exchange_api --start 2024-07-01 --end 2024-07-08 --output data/processed/azps_exchange.csv
      - name: Align observed AZPS-SRP reported hourly exchange
        run: |
          python -m grid_resilience.srp_azps_audit --demand-csv data/processed/four_ba_demand.csv --exchange-csv data/processed/azps_exchange.csv --output outputs/srp_azps_observed
      - name: Reuse weather archive cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: era5-western-us-2024-07-v1
      - name: Run five assumed AZPS-SRP link levels and compare to observations
        run: |
          python -m grid_resilience.srp_flow_validation \
            --demand-csv data/processed/four_ba_demand.csv \
            --capacities data/processed/four_ba_projection/modeled_nameplate_only.csv \
            --observed-csv outputs/srp_azps_observed/srp_azps_observed_hourly.csv \
            --output outputs/srp_flow_validation
      - name: Preserve observed and modeled hourly comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srp-observed-modeled-flow-sensitivity
          retention-days: 30
          if-no-files-found: warn
          path: |
            outputs/srp_azps_observed/
            outputs/srp_flow_validation/
            data/processed/four_ba_projection/projection_provenance.json
