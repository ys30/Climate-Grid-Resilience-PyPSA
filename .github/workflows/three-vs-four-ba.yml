name: Matched three-versus-four BA EIA-860 model comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/three-vs-four-ba.yml'
      - 'src/grid_resilience/three_vs_four_ba.py'
      - 'tests/test_three_vs_four_ba.py'
      - 'tests/test_local_shedding_isolation.py'
      - 'src/grid_resilience/select_capacity_bas.py'
      - 'tests/test_select_capacity_bas.py'
      - 'src/grid_resilience/western_us.py'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,model]'
      - run: python -m pytest -q
      - name: EIA-860 2024 four-BA inventory
        run: python -m grid_resilience.run_eia860 --bas CISO AZPS BPAT SRP --output data/processed/eia860_four_ba
      - name: Four-BA generator-only projection
        run: |
          python -m grid_resilience.capacity_projection --bas CISO AZPS BPAT SRP --source data/processed/eia860_four_ba/eia860_ba_technology_capacity.csv --output data/processed/four_ba_projection
      - name: Explicitly select three-BA capacities from same four-BA EIA inventory
        run: |
          python -m grid_resilience.select_capacity_bas \
            --source data/processed/four_ba_projection/modeled_nameplate_only.csv \
            --bas CISO AZPS BPAT \
            --output data/processed/three_ba_matched_nameplate.csv
      - name: Download observed four-BA demand
        run: |
          python -m grid_resilience.eia_api --bas CISO AZPS BPAT SRP --start 2024-07-01 --end 2024-07-08 --output data/processed/four_ba_demand.csv
      - name: Cache ERA5 downloads across runs
        uses: actions/cache@v4
        with:
          path: data/cache
          key: era5-western-us-2024-07-v1
      - name: Matched three-BA EIA-860 generator-only solve
        run: |
          python -m grid_resilience.western_us --eia-csv data/processed/four_ba_demand.csv --eia860-capacities data/processed/three_ba_matched_nameplate.csv --local-shedding --start 2024-07-01 --end 2024-07-08 --output outputs/matched_three_ba --cache data/cache
      - name: Matched four-BA EIA-860 generator-only solve
        run: |
          python -m grid_resilience.four_ba --demand-csv data/processed/four_ba_demand.csv --capacities data/processed/four_ba_projection/modeled_nameplate_only.csv --start 2024-07-01 --end 2024-07-08 --output outputs/matched_four_ba --cache data/cache
      - name: Compare aligned runs and preserve provenance
        run: |
          python -m grid_resilience.three_vs_four_ba --three outputs/matched_three_ba/metrics.csv --four outputs/matched_four_ba/metrics.csv --output outputs/three_vs_four_ba
      - name: Upload reproducible model comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-three-vs-four-ba-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            outputs/matched_three_ba/metrics.csv
            outputs/matched_three_ba/provenance.json
            outputs/matched_four_ba/metrics.csv
            outputs/matched_four_ba/provenance.json
            outputs/three_vs_four_ba/
            data/processed/eia860_four_ba/inventory_audit.json
            data/processed/three_ba_matched_nameplate.csv
            data/processed/three_ba_matched_nameplate.provenance.json
